[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtoo"
version = "0.2.0"
description = "Local document search for your WSL desktop"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2,<3; python_version < '3.11'",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "olefile>=0.47,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "sqlite-vec>=0.1.9,<0.2"]
mcp = ["mcp>=2,<3"]
vectors = ["sqlite-vec>=0.1.9,<0.2", "model2vec>=0.9,<1"]

[project.scripts]
xtoo = "xtoo.cli:main"

[tool.setuptools.package-data]
xtoo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
